[package]
name = "portside-tui"
version = "0.4.0"
edition = "2024"
description = "A terminal UI for tracking work sessions"
license = "Unlicense OR MIT"
authors = ["JayanAXHF <sunil.chdry@gmail.com>"]
homepage = "https://github.com/jayanaxhf/portside"
repository = "https://github.com/jayanaxhf/portside"
readme = "README.md"
keywords = ["tui", "cli", "github", "productivity", "ratatui"]
categories = ["command-line-utilities", "command-line-interface"]

[dependencies]
clap = { version = "4", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
discord-rich-presence = "1.1.0"
ratatui = { version = "0.30.2", features = ["serde"] }
ratatui-toaster = "0.1.4"
notify-rust = "4"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2.0.19"
time = { version = "0.3.55", features = ["formatting", "parsing", "local-offset", "macros"] }
toml = "0.8"
tui-big-text = "0.8.8"
tui-scrollview = "0.6.7"

[[bin]]
name = "portside"
path = "src/bin/portside.rs"

[target.'cfg(target_os = "macos")'.dependencies]
media-remote = { version = "0.5.2", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19.0", default-features = false, features = ["blocking-api"] }

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }-v{ version }{ archive-suffix }"
