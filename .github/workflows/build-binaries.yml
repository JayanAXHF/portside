# Builds cross-platform binaries and uploads to GitHub Releases.
# Binaries are discoverable by cargo-binstall (https://github.com/cargo-bins/cargo-binstall).
# Triggered automatically when release-plz publishes a release.
# Requires the trusted-publishing template. Add a RELEASE_PLZ_TOKEN PAT
# (contents:write + pull-requests:write) as a repo secret so release events
# trigger this workflow.
# https://github.com/settings/personal-access-tokens/new
name: Build Binaries

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    if: ${{ github.repository_owner == 'JayanAXHF' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }} -p portside-tui

      - name: Determine version
        id: version
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name }}"
          # Strip package name prefix (e.g. "my-crate-v0.1.0" -> "v0.1.0")
          VERSION="${TAG##*-v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Package (Unix)
        if: ${{ matrix.archive == 'tar.gz' }}
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../portside-${{ matrix.target }}-${{ steps.version.outputs.version }}.tar.gz portside

      - name: Package (Windows)
        if: ${{ matrix.archive == 'zip' }}
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path portside.exe -DestinationPath ../../../portside-${{ matrix.target }}-${{ steps.version.outputs.version }}.zip

      - name: Upload release asset
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: portside-${{ matrix.target }}-${{ steps.version.outputs.version }}.${{ matrix.archive }}
